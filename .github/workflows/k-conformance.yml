# Live K conformance is intentionally separate from ci.yml.  The normal
# workspace checks must remain hermetic: they use checked-in fixtures and do
# not install K or start a symbolic-execution server.
name: K conformance

on:
  pull_request:
    paths:
      - ".github/workflows/k-conformance.yml"
      - "bun.lock"
      - "package.json"
      - "packages/bison/package.json"
      - "packages/bison/src/**"
      - "packages/bison/test/**"
      - "packages/bison/fixtures/**"
      - "packages/ktool/package.json"
      - "packages/ktool/src/**"
      - "packages/ktool/test/**"
  push:
    paths:
      - ".github/workflows/k-conformance.yml"
      - "bun.lock"
      - "package.json"
      - "packages/bison/package.json"
      - "packages/bison/src/**"
      - "packages/bison/test/**"
      - "packages/bison/fixtures/**"
      - "packages/ktool/package.json"
      - "packages/ktool/src/**"
      - "packages/ktool/test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cterm-and-kcfg:
    name: CTerm and KCFG against K 7.1.337
    # Bison is pinned to Ubuntu Noble's exact package version. Do not change
    # this to ubuntu-latest: a runner-image transition must be paired with a
    # newly selected and verified external toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      K_SOURCE_REVISION: 4a46d1231473b599c699160132fd6e76a5c46406
      K_RELEASE: v7.1.337
      BISON_RELEASE: 3.8.2
      BISON_APT_VERSION: 2:3.8.2+dfsg-1build2
      KFRAMEWORK_TS_BISON_BIN: /usr/bin/bison
      # `kompileCached` owns this directory.  It is deliberately outside the
      # checkout: no generated K definition can appear as a working-tree edit.
      # `runner.temp` is not available in job-level `env` (it evaluated to
      # empty here, yielding the unwritable `/kframework-ts-kompile-cache`),
      # so the cache sits beside the checkout in the runner's work directory.
      KFRAMEWORK_TS_KOMPILE_CACHE: ${{ github.workspace }}/../kframework-ts-kompile-cache

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea

      - name: Install the exact external toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes "bison=$BISON_APT_VERSION" flex gcc g++

          k_store=$(nix build \
            --no-link \
            --print-out-paths \
            "github:runtimeverification/k/$K_SOURCE_REVISION#k.openssl")
          test -x "$k_store/bin-unwrapped/kompile"
          test ! -e "$k_store/bin/bison"

          # K's packaged wrappers prepend their own tool directories. Use the
          # unwrapped kompile entry point so deterministic grammar capture sees
          # the selected system Bison on PATH; retain wrapped peers for the
          # other live conformance scenarios.
          selected_bin="$RUNNER_TEMP/kframework-ts-selected-bin"
          mkdir "$selected_bin"
          for tool in "$k_store"/bin/*; do
            name=$(basename "$tool")
            if test "$name" != kompile; then
              ln -s "$tool" "$selected_bin/$name"
            fi
          done
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$k_store/bin-unwrapped/kompile" > "$selected_bin/kompile"
          chmod 0555 "$selected_bin/kompile"
          printf 'KFRAMEWORK_TS_K_BIN=%s\n' "$selected_bin" >> "$GITHUB_ENV"
          printf 'KFRAMEWORK_TS_K_WRAPPED_BIN=%s\n' "$k_store/bin" >> "$GITHUB_ENV"
          # Distribution discovery intentionally sees the real K prefix so the
          # kserver lane can locate lib/kframework/bin/ng. Parser capture calls
          # the explicitly selected unwrapped compiler.
          printf '%s\n' "$k_store/bin" >> "$GITHUB_PATH"

      - name: Verify the selected K tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$KFRAMEWORK_TS_K_BIN/kompile"
          test -x "$KFRAMEWORK_TS_K_BIN/kore-rpc"
          test -x "$KFRAMEWORK_TS_K_BIN/kore-rpc-booster"
          test "$(command -v kompile)" = "$KFRAMEWORK_TS_K_WRAPPED_BIN/kompile"
          test -x "$KFRAMEWORK_TS_BISON_BIN"
          actual=$("$KFRAMEWORK_TS_K_BIN/kompile" --version | sed -n 's/^K version:[[:space:]]*//p' | head -n 1)
          test "$actual" = "$K_RELEASE"
          actual_bison=$("$KFRAMEWORK_TS_BISON_BIN" --version | sed -n 's/^bison (GNU Bison) //p' | head -n 1)
          test "$actual_bison" = "$BISON_RELEASE"

      - run: bun install --frozen-lockfile

      # The live test imports public workspace entry points.  Those exports
      # intentionally point at gitignored `dist/` output, so a fresh checkout
      # must build before Bun can resolve the conformance harness.
      - run: bun run build

      # `kompileCached` keys individual definitions by canonical kompile args,
      # source text, and the selected executable.  This outer cache also keys
      # on every local source that can affect a live scenario: its contract
      # intentionally does not attempt to discover arbitrary files below an
      # include directory.
      - name: Restore cached K definitions
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.KFRAMEWORK_TS_KOMPILE_CACHE }}
          key: >-
            k-conformance-${{ runner.os }}-${{
            hashFiles(
            '.github/workflows/k-conformance.yml',
            'bun.lock',
            'packages/cterm/src/**',
            'packages/cterm/test/**',
            'packages/kcfg/src/**',
            'packages/kcfg/test/**',
            'packages/kast/src/**',
            'packages/konvert/src/**',
            'packages/kore/src/**',
            'packages/kore-rpc/src/**',
            'packages/ktool/src/**',
            'packages/ktool/test/fixtures/**'
            )
            }}

      # Do not run the broad test suite here: it already runs in ci.yml and
      # would make this expensive lane look meaningful even if its live test
      # were accidentally removed.  The conformance gate itself is explicit.
      - name: Run the CTerm live-K conformance scenario
        run: bun test packages/cterm/test/live-k.test.ts

      - name: Run the KCFG live-K conformance scenario
        run: bun test packages/kcfg/test/live-k.test.ts

      # B9's three spawn-layer fast paths: the native Bison parser (needs a
      # definition kompiled with --gen-glr-bison-parser), the in-process
      # definition cache, and a real kserver.  It also pins the /dev/stdin
      # regression — `kore-print` and the LLVM `interpreter` cannot be called at
      # all from Node or Bun with pyk's argv, and no unit test can show that.
      - name: Run the ktool throughput conformance scenario
        run: bun test packages/ktool/test/live-throughput.test.ts

      # The deterministic grammar lane puts the selected Bison executable on
      # K's PATH, then analyzes K's retained parser.y through that command.
      - name: Run Bison and K parser-capture conformance scenarios
        run: >-
          bun test
          packages/bison/test/bison.test.ts
          packages/ktool/test/generated-bison-live.test.ts
